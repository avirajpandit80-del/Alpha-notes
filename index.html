
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Alpha Notes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:22px 18px}
header h1{margin:0;font-size:27px}
header p{color:#cbd5e1;margin:7px 0 0}
main{max-width:700px;margin:auto;padding:16px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #d1d5db;border-radius:10px;background:white}
textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer}
.primary{background:#2563eb;color:white;width:100%;margin:8px 0}
.search{margin:8px 0 16px}
.note{background:white;border:1px solid #e5e7eb;border-radius:13px;padding:15px;margin:12px 0;overflow-wrap:anywhere}
.note h3{margin:0 0 8px}
.note p{white-space:pre-wrap;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{background:#e5e7eb}
#status{font-size:14px;color:#166534}
.empty{text-align:center;color:#6b7280;padding:24px}
</style>
</head>
<body>
<header>
  <h1>📝 Alpha Notes</h1>
  <p>Your personal notes, all in one place.</p>
</header>
<main>
  <h2 id="formTitle">Create a note</h2>
  <input id="title" placeholder="Note title">
  <textarea id="body" placeholder="Write your note here..."></textarea>
  <button class="primary" id="saveBtn" onclick="saveNote()">＋ Save Note</button>
  <button id="cancelBtn" onclick="resetForm()" hidden>Cancel edit</button>
  <p id="status" role="status"></p>

  <h2>My Notes</h2>
  <input class="search" id="search" placeholder="🔎 Search notes..." oninput="renderNotes()">
  <div id="notes"></div>
</main>
<script>
const KEY = "alpha-notes-v1";
let items = [];
let editingId = null;

try {
  items = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(items)) items = [];
} catch { items = []; }

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(items));
    return true;
  } catch {
    document.getElementById("status").textContent =
      "Could not save. Your browser storage may be full.";
    return false;
  }
}

function saveNote() {
  const title = document.getElementById("title").value.trim();
  const body = document.getElementById("body").value.trim();
  const status = document.getElementById("status");

  if (!title && !body) {
    status.textContent = "Please enter a title or note.";
    return;
  }

  const oldItems = [...items];

  if (editingId !== null) {
    items = items.map(n => n.id === editingId
      ? {...n, title: title || "Untitled", body, updated: Date.now()}
      : n);
  } else {
    items.unshift({
      id: Date.now().toString() + Math.random().toString(36).slice(2),
      title: title || "Untitled",
      body,
      updated: Date.now()
    });
  }

  if (!persist()) {
    items = oldItems;
    return;
  }

  resetForm();
  status.textContent = "Note saved successfully!";
  renderNotes();
}

function resetForm() {
  editingId = null;
  document.getElementById("title").value = "";
  document.getElementById("body").value = "";
  document.getElementById("formTitle").textContent = "Create a note";
  document.getElementById("saveBtn").textContent = "＋ Save Note";
  document.getElementById("cancelBtn").hidden = true;
}

function editNote(id) {
  const n = items.find(x => x.id === id);
  if (!n) return;
  editingId = id;
  document.getElementById("title").value = n.title;
  document.getElementById("body").value = n.body;
  document.getElementById("formTitle").textContent = "Edit note";
  document.getElementById("saveBtn").textContent = "Save Changes";
  document.getElementById("cancelBtn").hidden = false;
  window.scrollTo({top: 0, behavior: "smooth"});
}

function deleteNote(id) {
  if (!confirm("Delete this note?")) return;
  const oldItems = [...items];
  items = items.filter(n => n.id !== id);
  if (!persist()) { items = oldItems; return; }
  renderNotes();
}

async function shareNote(id) {
  const n = items.find(x => x.id === id);
  if (!n) return;
  const text = n.title + "\n\n" + n.body;

  try {
    if (navigator.share) {
      await navigator.share({title: n.title, text});
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      alert("Note copied. You can paste it into a message.");
    } else {
      prompt("Copy your note:", text);
    }
  } catch (e) {
    if (e.name !== "AbortError") alert("Sharing was not available.");
  }
}

function renderNotes() {
  const list = document.getElementById("notes");
  const q = document.getElementById("search").value.toLowerCase();
  list.replaceChildren();

  const filtered = items.filter(n =>
    (n.title + " " + n.body).toLowerCase().includes(q)
  );

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = items.length
      ? "No matching notes found."
      : "No notes yet. Create your first note above!";
    list.append(empty);
    return;
  }

  filtered.forEach(n => {
    const card = document.createElement("article");
    card.className = "note";

    const heading = document.createElement("h3");
    heading.textContent = n.title;
    const content = document.createElement("p");
    content.textContent = n.body;
    const date = document.createElement("small");
    date.textContent = "Updated: " + new Date(n.updated).toLocaleString();

    const actions = document.createElement("div");
    actions.className = "actions";

    function addButton(label, action) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = action;
      actions.append(b);
    }

    addButton("✏️ Edit", () => editNote(n.id));
    addButton("↗ Share", () => shareNote(n.id));
    addButton("🗑 Delete", () => deleteNote(n.id));

    card.append(heading, content, date, actions);
    list.append(card);
  });
}

renderNotes();
</script>
</body>
</html>
