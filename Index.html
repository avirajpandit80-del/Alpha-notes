
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Notes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fb;color:#20243a}
header{background:#171b2e;color:white;padding:24px 18px;border-radius:0 0 24px 24px}
header h1{margin:0 0 8px;font-size:28px}
header p{margin:0;color:#cbd0e8}
main{max-width:650px;margin:auto;padding:18px}
.card{background:white;padding:18px;border-radius:18px;margin-bottom:16px;box-shadow:0 4px 18px #18204410}
input,textarea{width:100%;padding:13px;border:1px solid #d9ddec;border-radius:10px;font-size:16px;margin:7px 0;font-family:inherit}
textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;background:#6755e8;color:white;font-size:15px;font-weight:bold;cursor:pointer;margin:4px 3px 4px 0}
.secondary{background:#e9eaf5;color:#292c43}
.note{border:1px solid #e1e4ef;padding:14px;border-radius:12px;margin-top:12px;overflow-wrap:anywhere}
.note h3{margin:0 0 8px}
.note p{white-space:pre-wrap}
.note img{max-width:100%;max-height:240px;border-radius:10px}
.small{font-size:12px;color:#737991}
</style>
</head>
<body>
<header>
<h1>📝 Alpha Notes</h1>
<p>Your ideas. Your space. Always ready.</p>
</header>
<main>
<section class="card">
<h2 id="formTitle">Create a note ✨</h2>
<input id="title" placeholder="Note title">
<textarea id="content" placeholder="Write your notes here..."></textarea>
<label for="photo">📷 Add a photo (optional)</label>
<input id="photo" type="file" accept="image/*">
<button onclick="saveNote()">Save note</button>
<button class="secondary" onclick="clearForm()">Clear</button>
<p class="small">Notes are saved in this browser on this device.</p>
</section>
<section class="card">
<h2>My notes 📚</h2>
<input id="search" placeholder="🔍 Search your notes..." oninput="renderNotes()">
<div id="notes"></div>
</section>
</main>
<script>
let data=[];
try{data=JSON.parse(localStorage.getItem('alphaNotes')||'[]')}catch(e){data=[]}
let editing=null;
function persist(){
try{localStorage.setItem('alphaNotes',JSON.stringify(data));return true}
catch(e){alert('Storage full. Try removing a large photo.');return false}
}
function clearForm(){
editing=null;
document.getElementById('title').value='';
document.getElementById('content').value='';
document.getElementById('photo').value='';
document.getElementById('formTitle').textContent='Create a note ✨';
}
async function saveNote(){
const title=document.getElementById('title').value.trim();
const content=document.getElementById('content').value.trim();
const file=document.getElementById('photo').files[0];
if(!title&&!content&&!file){alert('Please write a title, note, or choose a photo.');return}
let photo='';
if(file){
if(file.size>700000){alert('Please choose a photo under 700 KB.');return}
photo=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(file);
}).catch(()=> '');
if(!photo){alert('Could not read photo. Please try again.');return}
}
const old=editing===null?null:data.find(n=>n.id===editing);
const note={id:editing===null?Date.now():editing,title:title||'Untitled note',content,photo:photo||(old?old.photo:''),updated:new Date().toLocaleString()};
if(editing===null)data.unshift(note);
else data=data.map(n=>n.id===editing?note:n);
if(persist()){clearForm();renderNotes();alert('Note saved!')}
}
function renderNotes(){
const q=document.getElementById('search').value.toLowerCase();
const root=document.getElementById('notes');
root.replaceChildren();
const found=data.filter(n=>(n.title+' '+n.content).toLowerCase().includes(q));
if(!found.length){root.textContent='No notes yet. Create your first note above!';return}
found.forEach(n=>{
const box=document.createElement('article');box.className='note';
const h=document.createElement('h3');h.textContent=n.title;box.append(h);
const p=document.createElement('p');p.textContent=n.content;box.append(p);
if(n.photo){const img=document.createElement('img');img.src=n.photo;img.alt='Attached note photo';box.append(img)}
const time=document.createElement('div');time.className='small';time.textContent=n.updated||'';box.append(time);
const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>{
editing=n.id;
document.getElementById('title').value=n.title;
document.getElementById('content').value=n.content;
document.getElementById('photo').value='';
document.getElementById('formTitle').textContent='Edit note ✏️';
window.scrollTo({top:0,behavior:'smooth'});
};box.append(edit);
const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{
if(confirm('Delete this note?')){data=data.filter(x=>x.id!==n.id);if(persist())renderNotes()}
};box.append(del);
root.append(box);
});
}
renderNotes();
</script>
</body>
</html>
